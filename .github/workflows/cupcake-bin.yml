name: cupcake.bin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cupcake-bin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build cupcake.bin (standalone)
        run: |
          if [ ! -f platform/gnw/firmware_imports.ld ]; then
            echo "::error::Missing platform/gnw/firmware_imports.ld — run the regen-imports workflow_dispatch job once and commit the file."
            exit 1
          fi
          make cupcake-bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cupcake.bin
          path: |
            release/cupcake.bin
            docs/ATTRIBUTION.md

  # Regenerate firmware_imports.ld when the pinned firmware changes.
  # Runs only on maintainer workflow_dispatch with firmware checkout.
  regen-imports:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Checkout firmware (reference build only)
        uses: actions/checkout@v4
        with:
          repository: sylverb/game-and-watch-retro-go-sd-cupcake
          path: firmware
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3 python3-pip
          python3 -m pip install -r firmware/requirements.txt

      - name: Build reference firmware ELF
        working-directory: firmware
        run: make GNW_TARGET=mario -j"$(nproc)"

      - name: Generate firmware_imports.ld
        run: |
          bash tools/gen_overlay_imports.sh firmware/build/gw_retro_go.elf > platform/gnw/firmware_imports.ld
          head -20 platform/gnw/firmware_imports.ld

      - name: Upload imports artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_imports.ld
          path: platform/gnw/firmware_imports.ld
