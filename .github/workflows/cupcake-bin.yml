name: cupcake.bin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cupcake-bin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build cupcake.bin (ABI — port repo only)
        run: make cupcake-bin

      - name: Overlay size report
        run: |
          arm-none-eabi-size -A build-gnw/cupcake-overlay.elf | grep overlay_cupcake || true
          ls -la release/cupcake.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cupcake-bin
          path: |
            release/cupcake.bin
            docs/ATTRIBUTION.md

  attach-to-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-cupcake-bin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cupcake-bin
          path: artifact

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/release/cupcake.bin
            artifact/docs/ATTRIBUTION.md
