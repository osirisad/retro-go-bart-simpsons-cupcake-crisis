name: cupcake.bin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-cupcake-bin:
    # Tag pushes get a separate release job — this one is for main/PR CI only.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3-pil

      - name: Build cupcake.bin (ABI — port repo only)
        run: make cupcake-bin

      - name: Overlay size report
        run: |
          arm-none-eabi-size -A build-gnw/cupcake-overlay.elf | grep overlay_cupcake || true
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cupcake-bin
          path: |
            release/cupcake.bin
            release/cupcake_assets.dat
            release/license.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3-pil

      - name: Build cupcake.bin (ABI — port repo only)
        run: make cupcake-bin

      - name: Verify release outputs
        run: ls -la release/

      # First broken v0.1 run left an empty release + orphan draft; both block finalize.
      - name: Remove prior release for this tag (safe re-publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release delete "$tag" -y --cleanup-tag=false 2>/dev/null || true
          gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.draft==true and .tag_name==\"$tag\") | .id" \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            Early development release — expect rough edges.

            ## SD install

            Copy to your retro-go SD card:

            | File | SD path |
            |------|---------|
            | `cupcake.bin` | `/roms/homebrew/cupcake.bin` |
            | `cupcake_assets.dat` | `/roms/homebrew/cupcake_assets.dat` |

            Include `license.txt` when redistributing (RetroFab CC-BY-NC-ND terms).
          files: |
            release/cupcake.bin
            release/cupcake_assets.dat
            release/license.txt
